# Placeholder: proxy inverso para el stack completo (perfil `app`).
events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Resolver de Docker: permite arrancar nginx aunque backend/frontend no existan aún.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80;

    location /api/ {
      set $backend http://backend:8080;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint STOMP: llega en Fase 3 (B3.1); hasta entonces el backend no lo expone.
    location /ws {
      set $backend http://backend:8080;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location / {
      set $frontend http://frontend:80;
      proxy_pass $frontend;
      proxy_set_header Host $host;
    }
  }
}
