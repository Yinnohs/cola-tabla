# Perfil local: apunta a los servicios de infra/docker-compose.yml
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kanban
    username: kanban
    password: kanban
  data:
    redis:
      host: localhost
      port: 6379

# El frontend aun no envia JWT (Keycloak llega en la Fase 2): sin esto todo responde 401.
kanban:
  security:
    enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
