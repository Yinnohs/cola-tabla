spring:
  application:
    name: kanban-live
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Valida el claim iss; con jwk-set-uri definido no hay discovery en el arranque.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/kanban}
          # El decoder se resuelve de forma perezosa; Keycloak no tiene que estar arriba para arrancar.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/kanban/protocol/openid-connect/certs}

# OpenAPI/Swagger UI desactivados por defecto; se habilitan en los perfiles local y test.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
