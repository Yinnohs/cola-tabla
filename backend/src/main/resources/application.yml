spring:
  application:
    name: kanban-live
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Valida el claim iss; con jwk-set-uri definido no hay discovery en el arranque.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/kanban}
          # El decoder se resuelve de forma perezosa; Keycloak no tiene que estar arriba para arrancar.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/kanban/protocol/openid-connect/certs}

# OpenAPI/Swagger UI desactivados por defecto; se habilitan en los perfiles local y test.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

kanban:
  scheduling:
    enabled: true
  events:
    # B4.2: si faltan mas de max-gap eventos al reconectar => 410 EVENTS_GONE (recargar el tablero).
    max-gap: 500
    # B4.3: retencion del log board_event y purga periodica en lotes acotados (ADR-0005).
    retention: PT24H
    purge:
      interval: PT1H
      initial-delay: PT1M
      batch-size: 1000
      max-batches: 100
