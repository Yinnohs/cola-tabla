# Perfil test: el datasource lo inyecta Testcontainers (@ServiceConnection).
spring:
  data:
    redis:
      host: localhost
      port: 6379
management:
  health:
    redis:
      enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

kanban:
  # Sin tareas en segundo plano en tests; el test del job lo activa explicitamente.
  scheduling:
    enabled: false
